<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MC Lobby Chat Archive – Return2Beta</title>
  <link rel="icon" type="image/png" href="../../images/icon.png" />
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('/fonts/Minecraft.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      font-family: 'Minecraft', sans-serif;
      background-image: url("../../images/background.png");
      background-repeat: repeat;
      background-size: auto;
      color: #d8d8d8;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; padding-top: 48px; }

    /* ── Header (shared style) ─────────────────────────── */
    .header-band {
      min-height: 48px; width: 100%;
      background-image: url("../../images/header.png");
      background-repeat: repeat-x; background-position: top left; background-size: auto 48px;
      flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center;
      gap: 0 48px; padding: 0 48px; position: fixed; top: 0; z-index: 300;
    }
    .header-band::after {
      content: ''; position: absolute; top: 48px; left: 0; right: 0; bottom: 0;
      background-image: url("../../images/header.png");
      background-repeat: repeat-x; background-size: auto 48px;
      transform: scaleY(-1); z-index: 0; pointer-events: none;
    }
    .header-band > * { position: relative; z-index: 1; }
    .nav-link {
      display: flex; align-items: center; gap: 6px; height: 48px;
      text-decoration: none; color: #fff; font-size: 0.9rem; font-weight: 600;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
    }
    .nav-link img { height: 32px; width: 32px; object-fit: contain; }
    .nav-spacer { flex: 1; }

    /* ── Main ──────────────────────────────────────────── */
    main {
      flex: 1; max-width: 900px; width: 100%; margin: 0 auto;
      padding: 24px 20px 40px;
    }
    h1 {
      font-size: 1.6rem; color: #f5c542;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.7);
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.65rem; color: #888; margin-bottom: 20px;
    }

    /* ── Controls ──────────────────────────────────────── */
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; margin-bottom: 16px;
    }
    .controls input {
      flex: 1; min-width: 180px; padding: 6px 10px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(245,197,66,0.3);
      color: #d8d8d8; font-family: 'Minecraft', sans-serif; font-size: 0.7rem;
      border-radius: 3px; outline: none;
    }
    .controls input::placeholder { color: #555; }
    .btn {
      padding: 6px 14px; background: rgba(245,197,66,0.15);
      border: 1px solid rgba(245,197,66,0.4); border-radius: 3px;
      color: #f5c542; font-family: 'Minecraft', sans-serif; font-size: 0.65rem;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: rgba(245,197,66,0.28); }
    #msgCount { font-size: 0.65rem; color: #888; }

    /* ── Message list ──────────────────────────────────── */
    .log {
      background: rgba(0,0,0,0.6); border: 1px solid rgba(245,197,66,0.18);
      border-radius: 4px; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-msg {
      font-size: 0.78rem; line-height: 1.7; word-break: break-word;
      border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 2px;
    }
    .log-msg:last-child { border-bottom: none; }
    .log-time { color: #555; font-size: 0.8em; margin-right: 6px; }
    .log-source-web      { color: #55ff55; }
    .log-source-discord  { color: #7289da; }
    .log-source-minecraft{ color: #f5c542; }
    .log-text { color: #d8d8d8; }

    /* ── Censored words — blurred unless hovered ───────── */
    .censor {
      display: inline-block;
      background: rgba(255,80,80,0.15);
      border-radius: 2px;
      filter: blur(4px);
      cursor: pointer;
      user-select: none;
      transition: filter 0.2s;
    }
    .censor:hover { filter: blur(0); }

    .empty { color: #555; font-style: italic; padding: 20px 0; text-align: center; }
    .loading { color: #888; padding: 20px 0; text-align: center; }
    .error-msg { color: #f55; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>
  <header class="header-band" aria-label="Header">
    <a class="nav-link" href="/"><img src="../../images/home_icon.png" alt="Home" />Home</a>
    <a class="nav-link" href="/chat/"><img src="../../images/chat_icon.png" alt="Chat" />Chat</a>
    <div class="nav-spacer"></div>
  </header>

  <main>
    <h1>#mc_lobby Archive</h1>
    <p class="subtitle">All messages from the Minecraft server chat bridge. Hover over <span style="background:rgba(255,80,80,0.15);padding:0 4px;border-radius:2px;filter:blur(4px);display:inline-block">redacted</span> words to reveal them.</p>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search messages…" />
      <span id="msgCount"></span>
      <button class="btn" id="downloadBtn">Download .txt</button>
      <button class="btn" id="importBtn" style="border-color:rgba(85,255,85,0.4);color:#5f5" title="Fetch full Discord history (requires admin token)">↻ Import all from Discord</button>
    </div>

    <div class="log" id="log"><p class="loading">Loading…</p></div>
  </main>

  <script>
    // ── Profanity list ────────────────────────────────────
    // Basic list — extend as needed. Case-insensitive, whole-word match.
    const BAD_WORDS = [
      'fuck','fucking','fucker','fuk','f\\*ck',
      'shit','shitting','bullshit',
      'bitch','bitches',
      'asshole','ass',
      'cunt','cunts',
      'dick','dicks','dickhead',
      'cock','cocks',
      'nigger','nigga',
      'faggot','fag',
      'bastard',
      'damn','goddamn',
      'whore','slut',
      'piss','pissed',
      'retard','retarded',
      'kys','kill yourself',
    ];
    const CENSOR_RE = new RegExp(
      '(' + BAD_WORDS.map(w => w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')).join('|') + ')',
      'gi'
    );

    function censorText(raw) {
      const escaped = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return escaped.replace(CENSOR_RE, '<span class="censor">$1</span>');
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleString([], {
        year:'numeric', month:'short', day:'numeric',
        hour:'2-digit', minute:'2-digit'
      });
    }

    function sourceBadge(source) {
      if (source === 'minecraft') return { cls: 'log-source-minecraft', label: '[MC]' };
      if (source === 'discord')   return { cls: 'log-source-discord',   label: '[Discord]' };
      return                             { cls: 'log-source-web',        label: '[Web]' };
    }

    let allMessages = [];

    function renderMessages(msgs) {
      const log = document.getElementById('log');
      document.getElementById('msgCount').textContent = msgs.length + ' message' + (msgs.length !== 1 ? 's' : '');
      if (!msgs.length) {
        log.innerHTML = '<p class="empty">No messages found.</p>';
        return;
      }
      log.innerHTML = msgs.map(m => {
        const { cls, label } = sourceBadge(m.source);
        return `<div class="log-msg">` +
          `<span class="log-time">${formatTime(m.timestamp)}</span>` +
          `<span class="${cls}">${label} ${escHtml(m.username)}:</span> ` +
          `<span class="log-text">${censorText(m.text)}</span>` +
          `</div>`;
      }).join('');
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function applySearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!q) { renderMessages(allMessages); return; }
      renderMessages(allMessages.filter(m =>
        m.text.toLowerCase().includes(q) || m.username.toLowerCase().includes(q)
      ));
    }

    async function load() {
      try {
        const r = await fetch('https://chat.return2beta.com/mc-history');
        const d = await r.json();
        allMessages = d.messages || [];
        renderMessages(allMessages);
      } catch (e) {
        document.getElementById('log').innerHTML =
          '<p class="error-msg">Could not load history — chat server may be offline.</p>';
      }
    }

    document.getElementById('searchInput').addEventListener('input', applySearch);

    // Download as plain .txt (censored words shown as ***)
    document.getElementById('importBtn').addEventListener('click', async () => {
      const token = prompt('Enter import token:');
      if (!token) return;
      const btn = document.getElementById('importBtn');
      btn.textContent = 'Importing…'; btn.disabled = true;
      try {
        const r = await fetch('https://chat.return2beta.com/mc-history/import?token=' + encodeURIComponent(token));
        const d = await r.json();
        if (d.ok) { alert(`Imported ${d.imported} messages. Reloading…`); await load(); }
        else alert('Error: ' + (d.error || 'unknown'));
      } catch { alert('Request failed — server may be offline.'); }
      btn.textContent = '\u21bb Import all from Discord'; btn.disabled = false;
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const lines = allMessages.map(m => {
        const { label } = sourceBadge(m.source);
        const clean = m.text.replace(CENSOR_RE, '***');
        return `[${new Date(m.timestamp).toISOString()}] ${label} ${m.username}: ${clean}`;
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mc-lobby-archive.txt';
      a.click();
    });

    load();
  </script>
</body>
</html>
